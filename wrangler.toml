name = "frenzypay"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

[[d1_databases]]
binding = "DB"
database_name = "frenzypay"
database_id = "943fce53-2f87-4467-9fd2-f753969ef261"
migrations_dir = "migrations"

[vars]
NEAR_RPC_URL = "https://rpc.mainnet.fastnear.com"
ONECLICK_BASE_URL = "https://1click.chaindefuser.com"

# This file is the source of truth for the Pages project: a deploy replaces the
# dashboard's plain-text variables with [vars] above. Keys stay Pages secrets
# (SESSION_SECRET, ONECLICK_API_KEY, SMTP_PASS), which a deploy keeps. Invoice email (SMTP_* / MAIL_* /
# PUBLIC_BASE_URL, see .env.example) is off until those are set; add the non-secret ones to [vars] when enabling it.
