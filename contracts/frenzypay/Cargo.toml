[package]
name = "frenzypay"
version = "0.1.0"
edition = "2021"
description = "FrenzyPay public records: invoices, bills, payees and payroll batches on NEAR"
license = "MIT"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ed25519-dalek = "2"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
strip = "symbols"

# Standalone workspace so the crate does not attach to any parent manifest.
[workspace]
